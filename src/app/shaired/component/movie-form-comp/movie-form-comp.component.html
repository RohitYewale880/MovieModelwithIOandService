<div class="movimodel">
            <div class="card">
                <div class="card-header d-flex justify-content-between">
                    <h1 style="color: #e50914; font-weight: 600;">{{!isineditmode ? 'Add Movie' : 'Update Movie'}}</h1>
                    <i class="fa-solid fa-xmark closebtn"></i>
                    
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="movieName">Movie Name</label>
                        <input type="text" #movieName class="form-control mb-1">
                    </div>

                    <div class="form-group">
                        <label for="movieImg">Movie Image</label>
                        <input type="text" #movieImg class="form-control mb-1">
                    </div>

                    <div class="form-group">
                        <label for="movieDesciption">Movie Description</label>
                        <textarea #movieDesciption class="form-control mb-1" style="height: 100px;"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="movieRating">Movie Rating</label>
                        <select #movieRating class="form-control">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>

                </div>

                <div class="card-footer d-flex justify-content-between">
                    <button 
                    (click)="onMovieadd()"
                    *ngIf="!isineditmode"
                    class="btn btn-sm net-sec-btn">Add Movie</button>
                    <button 
                    (click)="onUdateMovie()"
                    *ngIf="isineditmode"
                    type="button" id="btnupdatemovie" class="btn btn-sm net-sec-btn ">Update Movie</button>
                    <button
                    (click)="formClose(false)"
                     type="button" id="btncloseform" class="btn btn-sm net-pri-btn closebtn">Close</button>
                </div>
            </div>
    </div>
